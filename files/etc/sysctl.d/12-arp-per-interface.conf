# Two uplinks live in the same /16 here - eth0 dhcp at metric 100, the wifi sta
# at 600. With the default arp_announce=0 the box picked whatever source address
# it felt like for outgoing ARP, so the router ended up caching the wifi address
# 10.0.100.3 against eth0's MAC. Then the cable dropped and BOTH addresses went
# dark until that entry aged out, which is what made the speaker vanish from
# Music Assistant for minutes at a time. announce=2 pins the sender address to
# the outgoing interface's own subnet; notify=1 makes us announce ourselves the
# moment a link returns instead of waiting on the neighbour's cache to expire.
net.ipv4.conf.all.arp_announce=2
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.all.arp_notify=1
