# Master hardware mixing device (dmix). 16 x 1024-frame periods = 372 ms of slack;
# the decoder is soft-float and occasionally misses its deadline. 16384 frames of
# S32 stereo is 128 KB, exactly the driver's buffer_bytes_max.
# dmix must slave a real hw PCM - it mixes straight into the DMA mmap buffer,
# so no plugin can sit between it and the card.
# S16_LE and nothing wider, however tempting: every gain stage below is software
# (PCM5102A has no volume register) and 16-bit multiplies truncate towards the same
# -96 dBFS floor the music is being attenuated to, which is what the HF grit at low
# volume is. But ralink-i2s only advertises S24/S32 - hw_params ORs in DATA_24 for
# wide formats and never sets a 32-bit word length, so 32-bit frames reach the DAC as
# full-scale white noise. Confirmed the hard way on Spotify, 2026-08-21; stock's own
# dmixer.conf is S16_LE as well. The grit has to be fixed in the players (volume in
# float, then dither) rather than in a format this i2s block cannot play.
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0660
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 1024
        buffer_size 16384
        rate 44100
        channels 2
        format S16_LE
    }
    bindings {
        0 0
        1 1
    }
}

# The one and only master volume. PCM5102A has no volume register and the
# TPA3116 gain is pin-strapped, so attenuation has to happen here in software.
# softvol's table is linear in dB, so 0..1000 lands on -60..0 dB. 0 is real
# silence, 1000 skips the multiply entirely.
# 1001 steps, not 101: librespot polls this control once a second and treats a
# difference of more than 65535/100 = 655 of its own units as someone else having
# moved the knob. A 0.6 dB step (101 steps over 60 dB) is ~7% of the value, i.e.
# ~1500 units, so every single poll looked like an external move, got written back
# one step lower, and the volume ratcheted down 1%/s while fighting the app's own
# slider. At 0.06 dB the round trip costs 0.67% = at most 442 units and stays
# inside the tolerance. Finer steps also kill the zipper noise while dragging.
# 1001 and not 1024 because softvol publishes its dB scale as an integer number of
# 0.01 dB per step: 6000/1023 truncates to 5, so the control claims its top end is
# -8.85 dB and every dB-based mapping layered on top of it comes out 17% too steep
# (shairport-sync does volume in dB, and librespot logs the bogus range as a
# rounding error). 6000/1000 is exact. Percent lands on raw as vol*10, too.
pcm.master {
    type softvol
    slave.pcm "dmixer"
    control {
        name "Master"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 1001
}

# Per-app stages below sit at 100% (bit-perfect memcpy) unless ha_ducking.sh
# pulls one down, so idle playback costs zero extra processing. They slave straight
# to master: c3eq offers S32_LE only, so with a 16-bit dmix it would need its own
# plug stage and would buy nothing (bypass is the factory tuning anyway). The two
# definitions stay here for when the tone control is wanted.
pcm.eqchain {
    type plug
    slave.pcm "eq_raw"
}

pcm.eq_raw {
    type c3eq
    slave.pcm "master"
    conf "/etc/c3eq.conf"
}

# 60 dB and not 51 like the rest: librespot with --volume-ctrl linear ignores the
# range this control reports and always assumes 60 dB (VolumeCtrl::Linear returns
# DEFAULT_DB_RANGE and range_ok() lets it override the reported one). softvol is
# dB-linear over its own span, so a 51 dB control turned the stock law into 0.85 of
# it - 25% came out -10.2 dB where stock is -12. At 60 dB the two agree exactly.
pcm.spotify_in {
    type softvol
    slave.pcm "master"
    control {
        name "Spotify"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
}

pcm.airplay_in {
    type softvol
    slave.pcm "master"
    control {
        name "AirPlay"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

# Dedicated path for squeezelite (LMS / Logitech Media Server)
# Two stages, because two different owners want a fader on this source and one
# control cannot serve both. "Squeeze" is the duck stage like every other source
# here - ha_ducking.sh pulls it down and mcud puts it back at max. "Slimproto" is
# the server's own fader: squeezelite pushes Music Assistant's remembered level
# onto it on every (re)connect. Pointing squeezelite at "Squeeze" meant mcud saw
# MA's 48% as an abandoned duck and restored it to max within 5 s, so the MA
# volume slider did nothing (7 "left ducked at 123/255 - restored" lines in one
# hour, one per squeezelite start). Two gains in series is just a channel fader
# under a master fader, and both are memcpy at 0 dB.
pcm.squeeze_in {
    type softvol
    slave.pcm "squeeze_srv"
    control {
        name "Squeeze"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.squeeze_srv {
    type softvol
    slave.pcm "master"
    control {
        name "Slimproto"
        card 0
    }
    # squeezelite has no dB info on a softvol, so it falls back to its linear
    # map: raw = 255*(72+floor(dB))/72 for whatever MA asked. The raw it picks
    # does not depend on this span (measured for MA 100/75/50/25/10/5/3% ->
    # 255/208/166/123/42/17/7), so the span alone decides how loud a slider
    # position is: dB = -span*(1 - raw/255). -23 dB puts MA at
    # 0/-4.2/-8.0/-11.9/-19.2/-21.5/-22.4 dB, i.e. within ~2 dB of the stock law
    # (20*log10(pct/100)) all the way down. -45 was tried for a quieter bottom
    # and lost ~8 dB at half slider, which is too much. Change this one number
    # and restart squeezelite, no reboot needed.
    # MA 1-2% is silent whatever the span: MA's own curve is already below
    # squeezelite's -72 dB floor there, so it asks for raw 0 and softvol mutes
    # hard on index 0.
    min_dB -23.0
    max_dB 0.0
}

pcm.music_in {
    type softvol
    slave.pcm "master"
    control {
        name "Music"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

# Dedicated path for Home Assistant TTS & alerts
pcm.tts_in {
