# Master hardware mixing device (dmix). 16 x 1024-frame periods = 372 ms of slack;
# the decoder is soft-float and occasionally misses its deadline, and the hw
# ceiling is 128 KB (32768 frames) so this still fits with room to spare.
# dmix must slave a real hw PCM - it mixes straight into the DMA mmap buffer,
# so no plugin can sit between it and the card.
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0660
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 1024
        buffer_size 16384
        rate 44100
        channels 2
        format S16_LE
    }
    bindings {
        0 0
        1 1
    }
}

# The one and only master volume. PCM5102A has no volume register and the
# TPA3116 gain is pin-strapped, so attenuation has to happen here in software.
# softvol's table is linear in dB, so 0..100 lands on -60..0 dB in even 0.6 dB
# steps - matches librespot's default 60 dB range so one number means the same
# thing everywhere. 0 is real silence, 100 skips the multiply entirely.
pcm.master {
    type softvol
    slave.pcm "dmixer"
    control {
        name "Master"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 101
}

# Per-app stages below sit at 100% (bit-perfect memcpy) unless ha_ducking.sh
# pulls one down, so idle playback costs zero extra processing.
pcm.spotify_in {
    type softvol
    slave.pcm "master"
    control {
        name "Spotify"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

