# Master hardware mixing device
pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0660
    slave {
        pcm "hw:0,0"
        mmap_emulation 1
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 44100
        channels 2
        format S16_LE
    }
    bindings {
        0 0
        1 1
    }
}

pcm.spotify_in {
    type softvol
    slave.pcm "dmixer"
    control {
        name "Spotify"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.airplay_in {
    type softvol
    slave.pcm "dmixer"
    control {
        name "AirPlay"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

# Dedicated path for squeezelite (LMS / Logitech Media Server)
pcm.squeeze_in {
    type softvol
    slave.pcm "dmixer"
    control {
        name "Squeeze"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.music_in {
    type softvol
    slave.pcm "dmixer"
    control {
        name "Music"
        card 0
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.!default {
    type plug
    slave.pcm "music_in"
}

ctl.!default {
    type hw
    card 0
}
