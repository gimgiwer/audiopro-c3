music_directory		"/tmp"
playlist_directory	"/tmp/mpd/playlists"
db_file			"/tmp/mpd/tag_cache"
log_file		"/tmp/mpd/mpd.log"
pid_file		"/tmp/mpd/pid"
state_file		"/tmp/mpd/state"

user			"root"
bind_to_address		"127.0.0.1"
port			"6600"
log_level		"default"
restore_paused		"no"
auto_update		"no"

audio_output {
	type		"alsa"
	name		"Audio Pro C3 ALSA"
	device		"upnp_in"
	format		"44100:24:2"
	mixer_type	"null"
}

replaygain		"off"
volume_normalization	"no"
audio_buffer_size	"4096"
buffer_before_play	"20%"
