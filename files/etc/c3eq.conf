# Voicing for the c3eq ALSA plugin. Re-read on every stream open, so a change
# takes effect on the next track / next connect - no service restart needed.
#
# Default is bypass, and that is deliberate: the stock Audio Pro firmware does
# not filter samples anywhere. Its "equalizer" is an nvram value (EQEnable /
# EQ_Bass / EQ_Treble in rootApp) shipped over the app protocol; nothing in the
# stock rootfs turns it into filter coefficients, the stock asoundrc has no
# filter stage, and the DAC (PCM5102A) and amp (TPA3116, pin-strapped gain)
# have no DSP at all. The voicing you hear is analog, on the amp board, and we
# never touched it. So a flat digital path *is* the factory tuning.
#
# Tone control below mirrors what the stock app exposed (bass + treble), for
# when you want more than factory. Use c3tone instead of editing by hand.

bypass 1

# --- tone control (managed by c3tone) ---
#preamp -3.5
#lowshelf 120 0.7 3.0
#highshelf 8000 0.7 0.0
