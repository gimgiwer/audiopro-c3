[server]
use-ipv4=yes
use-ipv6=no
# No allow-interfaces on purpose: avahi wants kernel device names here, not uci
# interface names. "lan,ap,wwan" matched nothing, so the daemon came up with
# zero interfaces and published nothing at all - shairport's _raop._tcp never
# reached the network and AirPlay was invisible. Taking every interface also
# survives the phy0-sta0/phy0-ap0 renames.
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=no
publish-workstation=no
publish-domain=yes
publish-resolv-conf-dns-servers=no

[reflector]
enable-reflector=no

[rlimits]
