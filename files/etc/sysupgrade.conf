## Files and directories to preserve across sysupgrade.
## The package keep.d lists already cover /etc/config/, /etc/dropbear/,
## /etc/asound.conf, /etc/uhttpd.{crt,key} and the passwd/shadow family.

# The Spotify login. Without it the user has to pick the speaker in the Spotify
# app once more after every flash; librespot writes the file back when they do,
# but it is a credential and deliberately not in the image.
/root/.cache/librespot/credentials.json

# Last volume mcud saw, in percent. Not config - it is state, written 10 s after
# the level stops moving. Losing it means the speaker comes back at the uci
# default instead of where the user left it.
/etc/mcud.volume
